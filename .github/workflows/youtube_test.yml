name: YouTube test upload

# Sube el reel más reciente como Short PRIVADO para ver el error exacto de la
# subida (bot/tools/test_youtube.py). No publica nada visible.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Subir un reel de prueba a YouTube (privado)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python bot/tools/test_youtube.py
