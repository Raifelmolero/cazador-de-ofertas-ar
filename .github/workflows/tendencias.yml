name: Tendencias ML

# Una vez por día baja las búsquedas en tendencia de Mercado Libre (/trends, el
# endpoint que sí acepta la app) y las deja en frontend/data/tendencias.json para
# que la web tenga contenido fresco aunque el scraper de ofertas esté bloqueado.
# Usa solo client_credentials: NO recibe ML_REFRESH_TOKEN (no rota el token de usuario).
on:
  schedule:
    - cron: '40 12 * * *'   # 09:40 ART
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tendencias-ml
  cancel-in-progress: false

jobs:
  tendencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Bajar tendencias
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python bot/tools/tendencias.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/tendencias.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: tendencias de ML [skip ci]"
            git pull --rebase -q
            git push
          fi
