name: Post de texto en Threads

on:
  workflow_dispatch:
    inputs:
      texto:
        description: 'Texto del post (máx. 500 caracteres)'
        required: true
        type: string
      threads:
        description: 'Publicar en Threads'
        type: boolean
        default: true
      telegram:
        description: 'Publicar también en el canal de Telegram'
        type: boolean
        default: false
      fijar:
        description: 'Fijar el mensaje en el canal de Telegram'
        type: boolean
        default: false
      dry_run:
        description: 'Solo simular (no publica)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deals-bot
  cancel-in-progress: false

jobs:
  texto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Publicar
        working-directory: bot
        env:
          TEXTO: ${{ inputs.texto }}
          TELEGRAM: ${{ inputs.telegram == true && '1' || '0' }}
          FIJAR: ${{ inputs.fijar == true && '1' || '0' }}
          THREADS: ${{ inputs.threads == true && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python texto_post.py

      # Registra el post en bot/state/posts_log.jsonl (lo cuenta weekly_report).
      # Mismo esquema que deals_bot.yml: rebase + hasta 3 intentos.
      - name: Guardar registro de publicaciones
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot/state
          if git diff --cached --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "bot: registrar post de texto [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi
