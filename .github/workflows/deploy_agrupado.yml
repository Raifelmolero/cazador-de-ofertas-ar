name: Deploy agrupado

# Producción no se despliega en cada merge ni en cada commit del bot.
# Este workflow junta lo acumulado y dispara un solo build, como máximo
# una vez por semana (domingo ~21:30 ART), o a mano con workflow_dispatch. Los cambios
# solo de bot/state (historial de precios, scan_log) NO lo disparan. El ignoreCommand
# (frontend/scripts/vercel-ignore.sh) solo buildea commits "deploy:".
# No usamos git.deploymentEnabled=false: sin un deploy hook, el commit
# vacío dejaría de desplegar. El ignore equivalente apaga el auto-deploy
# efectivo de merges y pushes.
on:
  schedule:
    - cron: '30 0 * * 1'  # una vez por semana: lunes 00:30 UTC = domingo ~21:30 ART (GitHub suele atrasarlo). Crédito USD 20/mes, tope total USD 30.
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar el commit de deploy aunque no haya cambios del sitio desde el último deploy:'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deploy-agrupado
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Disparar deploy si hay cambios
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LAST=$(git log -1 --grep='^deploy:' --format=%H || true)
          FORCE_DEPLOY=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" != "false" ]; then
            FORCE_DEPLOY=true
          fi

          if [ "$FORCE_DEPLOY" != "true" ]; then
            if [ -z "$LAST" ]; then
              echo "No hay un deploy: previo; disparo el agrupado."
            elif git diff --quiet "$LAST" HEAD -- frontend ':(exclude)frontend/data/oficina.json'; then
              echo "Sin cambios del sitio desde $LAST; no disparo deploy."
              exit 0
            else
              echo "Hay cambios del sitio desde $LAST; disparo el agrupado."
              git diff --stat "$LAST" HEAD -- frontend ':(exclude)frontend/data/oficina.json' | tail
            fi
          else
            echo "workflow_dispatch con force: disparo el agrupado."
          fi

          git commit --allow-empty -m "deploy: agrupado [skip ci]"
          git pull --rebase -q
          git push
