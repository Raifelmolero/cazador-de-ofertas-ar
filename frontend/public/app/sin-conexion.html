<head>

<title>Sin conexión — Cazador de Ofertas</title>
<style>

<body>
  <main>
    <img src="/app/icon-192.png" alt="">
    <h1>Estás sin conexión</h1>

    <button onclick="location.reload()">Reintentar</button>
  </main>
