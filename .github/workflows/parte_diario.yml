name: Parte diario

# Fase 1 del Director de agentes (docs/PLAN-DIRECTOR-AGENTES.md): un mensaje por
# Telegram privado al admin a las 8 con ofertas vigentes, publicaciones, fallas,
# PRs esperando OK y la tarea sugerida del día. Solo lee; no publica en público.

on:
  schedule:
    - cron: '7 11 * * *'   # 08:07 ART; minuto 7 porque GitHub atrasa los crons en punto
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: parte-diario
  cancel-in-progress: false

jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Mandar parte
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python bot/parte_diario.py
