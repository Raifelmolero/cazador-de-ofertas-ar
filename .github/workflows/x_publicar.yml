name: Publicar en X

# Un tuit por corrida en @cazaofertazas con un producto en su mínimo histórico
# (bot/x_post.py). Sin los secrets X_* corre en ensayo y no publica nada.

on:
  schedule:
    - cron: '23 13 * * *'   # 10:23 ART
    - cron: '23 16 * * *'   # 13:23 ART
    - cron: '23 22 * * *'   # 19:23 ART
    - cron: '53 0 * * *'    # 21:53 ART
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-publicar
  cancel-in-progress: false

jobs:
  tuit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Publicar
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python bot/x_post.py
      - name: Guardar registro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot/state/posts_log.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: tuit publicado [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
