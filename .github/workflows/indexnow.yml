name: IndexNow ping

# Avisa a Bing/Copilot (y demás buscadores IndexNow) que el sitio cambió.
# IndexNow desaconseja reenviar URLs sin cambios: en cada push se avisan
# solo las páginas nuevas, y una vez por día las que cambiaron (lastmod).
on:
  schedule:
    - cron: "30 16 * * *"  # 13:30 ART, después de la corrida del mediodía
  push:
    branches: [main]
    paths: ["frontend/lib/**", "frontend/app/**"]
  workflow_dispatch:
    inputs:
      modo:
        description: "push = solo nuevas, diario = nuevas + cambiadas en 26 h, todo = todas"
        default: diario
        type: choice
        options: [diario, push, todo]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Lo ya enviado vive en la caché de Actions (no en el repo): así el
      # push avisa solo páginas nuevas y la corrida diaria solo lo que cambió.
      - name: Recuperar URLs ya enviadas
        uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - name: Esperar el deploy de Vercel (solo en push)
        if: github.event_name == 'push'
        run: sleep 180
      - name: Avisar a IndexNow
        run: python bot/tools/indexnow.py ${{ github.event_name == 'push' && 'push' || (github.event_name == 'workflow_dispatch' && inputs.modo || 'diario') }}
      - name: Guardar URLs enviadas
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
