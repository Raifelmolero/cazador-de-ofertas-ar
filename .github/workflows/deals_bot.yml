name: Cazador Deals Bot

on:
  schedule:
    # 12:00, 17:00 y 21:00 hora Argentina (UTC-3)
    - cron: '0 15,20 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_ig_kit:
        description: 'Forzar publicación de Instagram (o kit si no hay token)'
        type: boolean
        default: false
      force_threads:
        description: 'Forzar publicación de Threads'
        type: boolean
        default: false
      force_reel:
        description: 'Publicar el reel del día (experimental)'
        type: boolean
        default: false
      force_facebook:
        description: 'Forzar publicación de Facebook'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deals-bot
  cancel-in-progress: false

jobs:
  post-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pillow

      - name: Instalar ffmpeg (para el reel del run nocturno)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # El bot commitea y hace pull --rebase durante la publicación (imágenes
      # de story/feed): sin identidad, si main avanzó el rebase queda trabado
      # y el estado de la corrida no se guarda.
      - name: Identidad de git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publicar ofertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ML_AFFILIATE_ID: ${{ secrets.ML_AFFILIATE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # YouTube Shorts / TikTok: opcionales, sin secrets no hacen nada
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
          FORCE_IG_KIT: ${{ inputs.force_ig_kit == true && '1' || '0' }}
          FORCE_THREADS: ${{ inputs.force_threads == true && '1' || '0' }}
          FORCE_REEL: ${{ inputs.force_reel == true && '1' || '0' }}
          FORCE_FACEBOOK: ${{ inputs.force_facebook == true && '1' || '0' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Falta el secreto TELEGRAM_BOT_TOKEN — agregalo en Settings → Secrets → Actions. Salgo sin publicar."
            exit 0
          fi
          python bot/cazador_bot.py

      - name: Actualizar panel de la oficina
        run: python bot/tools/oficina.py || echo "oficina.py falló (no frena al bot)"

      - name: Guardar estado y datos del sitio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot/state frontend/data/productos_rentables.json frontend/data/seguimiento.json frontend/data/oficina.json frontend/data/infladas.json
          if git diff --cached --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "bot: registrar ofertas publicadas [skip ci]"
            # Un rebase a medias de la publicación traba el pull: se aborta.
            git rebase --abort 2>/dev/null || true
            # alertas.yml también pushea (cada 15 min): hasta 3 intentos.
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi


  # Respaldo del cron de alertas.yml (GitHub a veces saltea los de 15 min):
  # después de guardar el historial, procesa pedidos y avisa bajas. Mismo grupo
  # de concurrencia que alertas.yml para no responder dos veces un mensaje.
  alertas:
    needs: post-deals
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: alertas
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Identidad de git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Procesar alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERTAS_KEY: ${{ secrets.ALERTAS_KEY }}
          ML_AFFILIATE_ID: ${{ secrets.ML_AFFILIATE_ID }}
        run: python bot/alertas.py
